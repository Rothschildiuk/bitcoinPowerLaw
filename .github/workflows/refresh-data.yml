name: Refresh PowerLaw data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These UTC hours cover 00:00, 06:00, 12:00, and
    # 18:00 Europe/Vienna local time across CET/CEST; the guard below keeps
    # only the intended local-time runs.
    - cron: "0 22,23,4,5,10,11,16,17 * * *"

permissions:
  contents: write

jobs:
  refresh_powerlaw_data:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve schedule guard
        id: schedule_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$(TZ=Europe/Vienna date +%H)" in
            00|06|12|18)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Not 00:00, 06:00, 12:00, or 18:00 Europe/Vienna; skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check out repository
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Configure git author
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: make install

      - name: Refresh snapshots and defaults
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: make update-all-data

      - name: Stop if there are no data changes
        if: steps.schedule_guard.outputs.should_run == 'true'
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No snapshot/default changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push data refresh
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          python3 scripts/bump_version.py patch
          git add core/constants.py package.json package-lock.json data/snapshots
          git commit -m "Update daily data snapshots"
          git push
