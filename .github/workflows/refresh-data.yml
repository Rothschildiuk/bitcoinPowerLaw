name: Refresh PowerLaw data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Keep 00:00/06:00/12:00/18:00 Europe/Vienna
    # with overlap only in DST transition months.
    # CET (UTC+1): January-March and November-December.
    - cron: "0 23,5,11,17 * 1-3,11-12 *"
    # CEST (UTC+2): March-October.
    - cron: "0 22,4,10,16 * 3-10 *"

permissions:
  contents: write

jobs:
  refresh_powerlaw_data:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve schedule guard
        id: schedule_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$EVENT_SCHEDULE" in
            "0 23,5,11,17 * 1-3,11-12 *"|"0 22,4,10,16 * 3-10 *")
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected schedule '$EVENT_SCHEDULE'; skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check out repository
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.schedule_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Configure git author
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: make install

      - name: Refresh snapshots and constants
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: make update-all-data

      - name: Stop if there are no data changes
        if: steps.schedule_guard.outputs.should_run == 'true'
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No snapshot/default changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push data refresh
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          python3 scripts/bump_version.py patch
          git add core/constants.py package.json package-lock.json data/snapshots
          git commit -m "Update daily data snapshots"
          git push
